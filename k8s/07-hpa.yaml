apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fishguard-backend-hpa
  namespace: fishguard
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fishguard-backend-deployment
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fishguard-ml-hpa
  namespace: fishguard
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fishguard-ml-deployment
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
