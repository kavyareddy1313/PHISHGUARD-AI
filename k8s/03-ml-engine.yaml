apiVersion: apps/v1
kind: Deployment
metadata:
  name: fishguard-ml-deployment
  namespace: fishguard
  labels:
    app: fishguard-ml
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fishguard-ml
  template:
    metadata:
      labels:
        app: fishguard-ml
    spec:
      containers:
        - name: ml-engine
          image: fishguard-ml-engine:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
          resources:
            requests:
              cpu: "300m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: fishguard-ml-service
  namespace: fishguard
spec:
  selector:
    app: fishguard-ml
  ports:
    - protocol: TCP
      port: 8001
      targetPort: 8001
