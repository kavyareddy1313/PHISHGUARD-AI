apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fishguard-ingress
  namespace: fishguard
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  rules:
    - host: fishguard.soc.internal
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: fishguard-backend-service
                port:
                  number: 5001
          - path: /socket.io
            pathType: Prefix
            backend:
              service:
                name: fishguard-backend-service
                port:
                  number: 5001
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fishguard-frontend-service
                port:
                  number: 80
