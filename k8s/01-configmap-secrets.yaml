apiVersion: v1
kind: ConfigMap
metadata:
  name: fishguard-config
  namespace: fishguard
data:
  NODE_ENV: "production"
  PORT: "5001"
  ML_SERVICE_URL: "http://fishguard-ml-service.fishguard.svc.cluster.local:8001"
  DATABASE_HOST: "postgres-service.fishguard.svc.cluster.local"
  DATABASE_PORT: "5432"
  DATABASE_NAME: "fishguard_db"
---
apiVersion: v1
kind: Secret
metadata:
  name: fishguard-secrets
  namespace: fishguard
type: Opaque
stringData:
  POSTGRES_USER: "fishguard"
  POSTGRES_PASSWORD: "cybersecurity_secure_pass"
  DATABASE_URL: "postgres://fishguard:cybersecurity_secure_pass@postgres-service.fishguard.svc.cluster.local:5432/fishguard_db"
