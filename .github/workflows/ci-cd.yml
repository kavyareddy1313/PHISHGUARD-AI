name: FishGuard AI CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # -------------------------------------------------------------
  # 1. TEST & VALIDATE STAGE
  # -------------------------------------------------------------
  test-and-validate:
    name: Lint, Test & Validate Services
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python ML Dependencies & Test Model
        run: |
          cd ml-engine
          pip install -r requirements.txt
          python train_model.py

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate Backend
        run: |
          cd backend
          npm ci
          node -e "const PhishingAnalyzer = require('./src/services/PhishingAnalyzerEngine'); const a = new PhishingAnalyzer(); a.analyze({subject:'test', body:'test'}).then(r => console.log('Analyzer syntax test passed'));"

      - name: Validate & Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

  # -------------------------------------------------------------
  # 2. SECURITY SCANNING (Trivy & Audit)
  # -------------------------------------------------------------
  security-audit:
    name: Cybersecurity Vulnerability Scan
    needs: test-and-validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy Vulnerability Scanner on Repository
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'

  # -------------------------------------------------------------
  # 3. DOCKER BUILD & PUSH STAGE
  # -------------------------------------------------------------
  build-and-push-containers:
    name: Build & Push Container Images
    needs: security-audit
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push ML Engine
        uses: docker/build-push-action@v5
        with:
          context: ./ml-engine
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/ml-engine:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Backend API
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Frontend Dashboard
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------------
  # 4. KUBERNETES MANIFEST VALIDATION & DEPLOYMENT
  # -------------------------------------------------------------
  k8s-validate-and-deploy:
    name: Validate K8s Manifests & Deploy
    needs: build-and-push-containers
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Kubeval / Kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate Kubernetes Manifests
        run: |
          kubeconform -summary -verbose k8s/*.yaml

      - name: Deploy to Kubernetes Cluster (Simulated / Production)
        run: |
          echo "Applying manifests to Kubernetes cluster..."
          # kubectl apply -f k8s/
          echo "Deployment successful! Pods updated."
